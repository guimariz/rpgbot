<div class="flex flex-col h-full rounded-2xl bg-surface-raised border border-surface-overlay overflow-hidden">

  <!-- Header -->
  <div class="px-5 pt-5 pb-2 shrink-0">
    <p class="text-[10px] font-semibold tracking-widest uppercase text-zinc-500">Notas Rápidas</p>
  </div>

  <!-- Textarea -->
  <div class="flex-1 px-4 pb-4 min-h-0 flex flex-col">
    <textarea
      class="flex-1 w-full bg-surface-base rounded-xl border border-surface-overlay text-zinc-300 text-sm leading-relaxed p-3 resize-none focus:outline-none focus:border-neon-cyan/40 placeholder-zinc-700 transition-colors font-mono"
      placeholder="Anotações rápidas da cena..."
      [value]="content()"
      (input)="content.set($any($event.target).value)"
      spellcheck="false"
    ></textarea>
  </div>
</div>
